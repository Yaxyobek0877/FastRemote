# This server belongs exclusively to FastRemote, separate from personal tmux.
set -s exit-empty off
set -s exit-unattached off
set -sg escape-time 10
set -g status off
set -g history-limit 10000
set -g default-terminal xterm-256color
set -g default-shell /bin/bash
set -g default-command 'exec /bin/bash --login -i'
set -g prefix None
set -g prefix2 None
set -g mouse off
set -g set-clipboard off
set -g allow-rename off
set -g update-environment ''
set -w -g automatic-rename off
set -w -g remain-on-exit on
set -w -g window-size manual

# Keep browser scrollback visible; tmux itself preserves application alt screens.
set -as terminal-overrides ',xterm*:smcup@:rmcup@'
